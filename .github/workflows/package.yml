name: Package Chrome extension

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test, verify upstream, build and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload installable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: opencli-upload-lab-1.0.24.1
          path: |
            dist/opencli-upload-lab-1.0.24.1.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
